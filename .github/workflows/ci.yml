name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install 'ruff>=0.14,<1'
      - name: Lint for syntax and undefined names
        run: ruff check --select E9,F63,F7,F82 app.py src tests frontend/scripts
      - name: Python tests
        run: python -m pytest -q
      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend tests
        run: npm test
        working-directory: frontend
      - name: Frontend build
        run: npm run build
        working-directory: frontend
